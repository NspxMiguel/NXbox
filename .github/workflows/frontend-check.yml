name: Compile Xbox frontend
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .cache/cpm
          key: uwp-cpm-${{ runner.os }}-${{ hashFiles('cpmfile.json', '**/cpmfile.json') }}
      - uses: Mozilla-Actions/sccache-action@v0.0.11
      - run: python tools/nxbox/prepare_host_tools.py
      - name: Compile frontend objects
        shell: cmd
        run: tools\nxbox\build-uwp.cmd frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nxbox-frontend-check
          retention-days: 7
          path: |
            build-uwp/configure.log
            build-uwp/frontend.log
